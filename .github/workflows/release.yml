name: release
# Release joueur : sur un tag vX.Y.Z poussé (X.Y.Z = fichier VERSION), build release du mod et des outils (build.yml),
# paquet joueur (zip), puis release GitHub avec le zip, l'installateur et SHA256SUMS. Procédure : docs/RELEASE.md.
# Notes : section de la version dans CHANGELOG.md (tools/release/release-notes.ps1), obligatoire.
# Essai à blanc (aucune release, seulement un artefact « release-dry-run ») : workflow_dispatch (une fois ce fichier
# sur la branche par défaut), ou push d'une branche release-dry-run/<nom> (à supprimer ensuite).
on:
  push:
    tags: ["v*.*.*"]
    branches: ["release-dry-run/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : artefact seulement, aucune release"
        type: boolean
        default: true
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
defaults: { run: { shell: pwsh } }

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION invalide : '$v'"; exit 1; }
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$v" ]]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas au fichier VERSION ($v) : release refusée."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Changelog
        # Notes de version = section de CHANGELOG.md (source unique) : pas de release sans elle.
        run: ./tools/release/release-notes.ps1 -Version "${{ steps.v.outputs.version }}"
        shell: pwsh

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    secrets: inherit

  package:
    needs: [check, build]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions: { contents: write }
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: e33lanes-mod, path: art/mod }
      - uses: actions/download-artifact@v4
        with: { name: e33lanes-tools, path: art/tools }
      # Fork : UE4SS.dll et dwmapi.dll viennent de notre build (source épinglée) ; la config et les mods Lua standard de
      # la release 1181 sont dans tools/package/ue4ss-std (l'asset experimental-latest a été remplacé par la v4, 2026-11-16).
      - name: Player package
        run: |
          $exe = Get-ChildItem art/tools -Recurse -Filter "Installer E33 Lanes.exe" | Select-Object -First 1
          if (-not $exe) { throw "installateur absent des artefacts" }
          $info = Get-Content art/mod/build-info.txt -Raw
          if ($info -notmatch "version=$([regex]::Escape($env:VERSION))") { throw "build-info.txt ne porte pas la version $env:VERSION" }
          New-Item -ItemType Directory -Force dist | Out-Null
          ./tools/package/make-player-package.ps1 -Package art/mod -Ue4ssDir tools/package/ue4ss-std -Installer $exe.FullName -Out dist/e33lanes-player.zip
          # Nom de l'asset sans espace (GitHub remplace les espaces par des points) ; libellé « Installer E33 Lanes.exe ».
          Copy-Item $exe.FullName "dist/Installer.E33.Coop.exe"
          Push-Location dist
          $lines = foreach ($f in @("e33lanes-player.zip", "Installer.E33.Coop.exe")) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n")
          Pop-Location
          Get-Content dist/SHA256SUMS
          Get-ChildItem dist | Select-Object Name, Length
      - name: Release notes
        run: ./tools/release/release-notes.ps1 -Version $env:VERSION -Out dist-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/
            dist-notes.md
          retention-days: 14
      - name: GitHub release
        if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "E33 Lanes $env:VERSION" --notes-file dist-notes.md --latest `
            dist/e33lanes-player.zip "dist/Installer.E33.Coop.exe#Installer E33 Lanes.exe" dist/SHA256SUMS
